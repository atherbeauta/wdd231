<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lubumbashi Chamber of Commerce</title>
<meta name="description" content="Official Chamber of Commerce page for businesses in Lubumbashi">
<meta name="author" content="Kazadi Athanase Muamba">

<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3e2.png">

<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/medium.css">
<link rel="stylesheet" href="styles/larger.css">
</head>

<body>

<header>
    <div class="header-top">
        <h1>Lubumbashi Chamber</h1>
        <button id="menuBtn" aria-label="Toggle menu">&#9776;</button>
    </div>
    <nav id="navMenu">
        <a href="index.html">Home</a>
        <a href="directory.html">Directory</a>
        <a href="#">Events</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <img src="https://images.unsplash.com/photo-1505761671935-60b3a7427bad?w=1400"
         alt="Lubumbashi city view">
    <a href="#" class="cta">Join the Chamber</a>
</section>

<main>

<section>
    <h2>Current Events</h2>
    <ul>
        <li>Economic Forum – February 15</li>
        <li>Business Expo – February 20</li>
        <li>Innovation Conference – February 28</li>
    </ul>
</section>

<section>
    <h2>Weather in Lubumbashi</h2>
    <div id="weather">Loading weather data...</div>
</section>

<section>
    <h2>Member Spotlights</h2>
    <div id="spotlights" class="spotlights"></div>
</section>

</main>

<footer>
    <p>© 2026 Lubumbashi Chamber of Commerce</p>
    <p id="lastModified"></p>
</footer>

<script>
window.addEventListener("load", () => {

    /* Last Modified */
    document.getElementById("lastModified").textContent =
        "Last Modified: " + document.lastModified;

    /* Hamburger menu */
    const btn = document.getElementById("menuBtn");
    const nav = document.getElementById("navMenu");
    btn.addEventListener("click", () => {
        nav.classList.toggle("open");
    });

    /* Weather */
    const apiKey = "db06646f64189b6479877366aba5a0a2";
    const weatherURL = `https://api.openweathermap.org/data/2.5/forecast?q=Lubumbashi,CD&units=metric&appid=${apiKey}`;

    fetch(weatherURL)
        .then(response => response.json())
        .then(data => {
            const now = data.list[0];
            let html = `<p><strong>${now.main.temp.toFixed(1)}°C</strong> – ${now.weather[0].description}</p>`;
            html += "<h3>3-Day Forecast</h3>";
            for (let i = 1; i <= 3; i++) {
                const d = data.list[i * 8];
                const date = new Date(d.dt_txt).toLocaleDateString("en-US", { weekday: "long" });
                html += `<p>${date}: ${d.main.temp}°C</p>`;
            }
            document.getElementById("weather").innerHTML = html;
        })
        .catch(() => {
            document.getElementById("weather").textContent = "Weather unavailable.";
        });

    /* Spotlights */
    fetch("data/members.json")
        .then(res => res.json())
        .then(members => {
            const filtered = members.filter(m =>
                m.membership === "gold" || m.membership === "silver"
            );
            filtered.sort(() => Math.random() - 0.5);
            const chosen = filtered.slice(0, 3);

            const container = document.getElementById("spotlights");
            chosen.forEach(m => {
                container.innerHTML += `
                <div class="card">
                    <img src="${m.logo}" alt="${m.name}">
                    <h3>${m.name}</h3>
                    <p>${m.phone}</p>
                    <p>${m.address}</p>
                    <a href="${m.website}" target="_blank">Visit Website</a>
                </div>`;
            });
        });
});
</script>

</body>
</html>
