<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lubumbashi Chamber of Commerce</title>
    <!-- Styles intégrés pour garantir que la prévisualisation fonctionne immédiatement -->
    <style>
        :root {
            --primary: #1a3a5f;      /* Deep Blue */
            --secondary: #2c5282;    /* Medium Blue */
            --accent: #f6ad55;       /* Gold */
            --bg-light: #f8fafc;     /* Background trame */
            --bg-tint: #f1f5f9;      /* Subtle trame */
            --white: #ffffff;
            --text: #2d3748;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --radius: 8px;
        }

        /* Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text);
            line-height: 1.6;
        }

        /* Layout & Navigation */
        header {
            background-color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-block { display: flex; align-items: center; gap: 12px; }
        .logo-block h1 { color: var(--primary); font-size: 1.4rem; }

        #menu-btn {
            font-size: 1.8rem;
            background: var(--bg-tint);
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 4px 12px;
            cursor: pointer;
            color: var(--primary);
        }

        nav ul {
            list-style: none;
            display: none;
            flex-direction: column;
            position: absolute;
            top: 100%; left: 0; width: 100%;
            background: var(--primary);
            padding: 1rem 0;
        }

        nav ul.open { display: flex; }

        nav a {
            display: block;
            padding: 1rem 5%;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: 0.3s;
        }

        nav a:hover { background: var(--secondary); }

        /* Hero */
        .hero {
            background: linear-gradient(rgba(26,58,95,0.85), rgba(26,58,95,0.85)), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 5rem 1rem;
        }

        .hero h2 { font-size: 2.5rem; margin-bottom: 1rem; }
        .cta-btn {
            display: inline-block;
            background: var(--accent);
            color: var(--primary);
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: var(--radius);
            margin-top: 1rem;
        }

        /* Directory Controls */
        .controls {
            text-align: center;
            padding: 2rem 0;
            background: var(--bg-tint);
        }

        .controls button {
            padding: 10px 25px;
            margin: 0 5px;
            cursor: pointer;
            border: 2px solid var(--secondary);
            background: white;
            color: var(--secondary);
            font-weight: bold;
            border-radius: 4px;
            transition: 0.3s;
        }

        .controls button.active {
            background: var(--secondary);
            color: white;
        }

        /* Main Container */
        main {
            padding: 2rem 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        #directory-container.grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Member Cards */
        .member-card {
            background: var(--white);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            border-top: 6px solid var(--primary);
            transition: transform 0.3s ease;
        }

        .member-card:hover { transform: translateY(-5px); }
        .member-card img { width: 80px; height: auto; margin-bottom: 1rem; opacity: 0.8; }
        .member-card h3 { color: var(--primary); margin-bottom: 0.5rem; font-size: 1.2rem; }
        .member-card p { font-size: 0.9rem; color: #555; margin-bottom: 4px; }
        .member-card a { color: var(--secondary); font-weight: bold; text-decoration: none; display: block; margin: 10px 0; }

        /* List View Styles */
        #directory-container.list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #directory-container.list .member-card {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            text-align: left;
            align-items: center;
            padding: 1rem 2rem;
            border-top: none;
            border-left: 6px solid var(--primary);
        }

        #directory-container.list .member-card img { display: none; }

        /* Footer */
        footer {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
            margin-top: 4rem;
        }

        /* Desktop Adjustments */
        @media (min-width: 768px) {
            #menu-btn { display: none; }
            nav ul { display: flex; flex-direction: row; position: static; background: transparent; padding: 0; }
            nav a { color: var(--primary); padding: 0.5rem 1.5rem; }
            nav a:hover { background: transparent; color: var(--secondary); }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-block">
            <!-- Remplacement par un placeholder si kat.png manque -->
            <div style="width:40px;height:40px;background:var(--accent);border-radius:50%"></div>
            <h1>Lubumbashi Chamber</h1>
        </div>
        <button id="menu-btn" aria-label="Menu Toggle">&#9776;</button>
        <nav>
            <ul id="nav-list">
                <li><a href="#">Home</a></li>
                <li><a href="#">Directory</a></li>
                <li><a href="#">Join</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h2>Member Directory</h2>
        <p>Support our local businesses and find trusted partners in Haut-Katanga.</p>
        <a href="#" class="cta-btn">Join the Chamber Now!</a>
    </section>

    <div class="controls">
        <button id="grid-view" class="active">Grid View</button>
        <button id="list-view">List View</button>
    </div>

    <main>
        <div id="directory-container" class="grid">
            <!-- Data will be injected here -->
            <p id="loading-msg">Fetching member data...</p>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Lubumbashi Chamber | WDD231 Project</p>
        <p id="lastModified"></p>
    </footer>

    <script>
        // Configuration des données (Normalement dans members.json)
        const memberData = [
            { "name": "Katanga Mining Corp", "address": "123 Mining Road", "phone": "+243 810 001", "website": "#", "membership": "Gold", "tags": ["Mining"] },
            { "name": "Grand Karavia Hotel", "address": "Route du Golf", "phone": "+243 810 002", "website": "#", "membership": "Gold", "tags": ["Tourism"] },
            { "name": "Lubum Tech Hub", "address": "45 Tech Avenue", "phone": "+243 850 003", "website": "#", "membership": "Silver", "tags": ["IT"] },
            { "name": "Hyper Psaro", "address": "Avenue Ndjamena", "phone": "+243 810 004", "website": "#", "membership": "Gold", "tags": ["Retail"] },
            { "name": "Equity BCDC", "address": "Avenue de la Poste", "phone": "+243 810 007", "website": "#", "membership": "Gold", "tags": ["Banking"] }
        ];

        const container = document.querySelector('#directory-container');
        const gridBtn = document.querySelector('#grid-view');
        const listBtn = document.querySelector('#list-view');

        // Affichage des membres
        function displayMembers(members) {
            container.innerHTML = "";
            members.forEach(m => {
                const card = document.createElement('section');
                card.className = "member-card";
                card.innerHTML = `
                    <div style="font-size:2rem;margin-bottom:10px">🏢</div>
                    <h3>${m.name}</h3>
                    <p>${m.address}</p>
                    <p>${m.phone}</p>
                    <a href="${m.website}">Visit Website</a>
                    <p><strong>${m.membership} Member</strong></p>
                `;
                container.appendChild(card);
            });
        }

        // Logic de basculement
        gridBtn.addEventListener('click', () => {
            container.className = "grid";
            gridBtn.classList.add('active');
            listBtn.classList.remove('active');
        });

        listBtn.addEventListener('click', () => {
            container.className = "list";
            listBtn.classList.add('active');
            gridBtn.classList.remove('active');
        });

        // Menu Mobile
        document.querySelector('#menu-btn').addEventListener('click', () => {
            document.querySelector('#nav-list').classList.toggle('open');
        });

        // Footer
        document.getElementById('currentyear').textContent = new Date().getFullYear();
        document.getElementById('lastModified').textContent = "Last Modified: " + document.lastModified;

        // Initialisation
        setTimeout(() => displayMembers(memberData), 500);
    </script>
</body>
</html>
